[package]
name = "tg18-desktop"
version = "0.1.0"
edition = "2021"
description = "Window app for the tg18 (Tamagotchi Meets/On) emulator"
license = "MIT"

[[bin]]
name = "tg18"
path = "src/main.rs"

[dependencies]
tg18-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
miniz_oxide = "0.8"
